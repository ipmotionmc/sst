name: build-iplex-binary

# Builds a Linux x86_64 sst binary with the iplex-eventlog-fix patch
# applied and uploads it as a GitHub Release artifact. Used by
# ipmotionmc/iplex's deploy-production workflow to swap in our patched
# binary in place of the upstream npm `sst` package's binary.
#
# Trigger: push to the `iplex-eventlog-fix` branch (or manual dispatch).
# Output: a release tagged `v<base>-iplex.<run-number>` with
# `sst-linux-x86_64.tar.gz` attached. Each run produces a new tag, so
# no clobber logic is needed.

on:
  push:
    branches:
      - iplex-eventlog-fix
  workflow_dispatch:

permissions:
  contents: write

env:
  # Hardcoded — sst/sst's root package.json has no `.version` field;
  # version comes from goreleaser via git tags upstream. We pin to the
  # tag we branched from (v4.12.10) so the iplex tag composes cleanly:
  # v4.12.10-iplex.<run>.
  BASE_VERSION: "4.12.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build platform (populates platform/dist for go:embed)
        # Same script upstream's release.yml uses, sans DOCKER_PUSH (we
        # only need the embedded files; the docker push step targets
        # downstream consumers we don't have).
        run: ./platform/scripts/build

      - name: Build sst binary (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -mod=readonly \
              -ldflags="-buildid=" \
              -o sst-linux-x86_64 \
              ./cmd/sst

      - name: Tar binary
        run: tar -czf sst-linux-x86_64.tar.gz sst-linux-x86_64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.BASE_VERSION }}-iplex.${{ github.run_number }}
        run: |
          gh release create "$TAG" sst-linux-x86_64.tar.gz \
            --title "$TAG" \
            --notes "iplex-patched sst binary. Linux x86_64 only. Patch in pkg/project/run.go preserves partial-line bytes across io.EOF in the eventlog tail loop. See ipmotionmc/iplex#794."
